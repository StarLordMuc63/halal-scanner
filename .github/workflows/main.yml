name: Daily halal scan

on:
  schedule:
    - cron: "0 4 * * 1-5"    # Mo-Fr 04:00 UTC = 06:00 Berlin (Sommerzeit) / 05:00 (Winterzeit)
  workflow_dispatch:          # Knopf "Run workflow" zum manuellen Starten

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          CI: "true"
        run: |
          mkdir -p scans
          python halal_scanner.py | tee scans/latest_report.txt

      - name: Save results
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add scans
          git commit -m "Scan $(date -u +%F)" || echo "nothing new"
          git push
